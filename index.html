<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bippin Shekar Goud — AI Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #000;
      --term-bg:   #0d0d0d;
      --chrome-bg: #1a1a1a;
      --green:     #4ade80;
      --white:     #e8e8e8;
      --mid:       #888;
      --dim:       #444;
      --mono:      'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, monospace;
    }

    html {
      background: var(--bg);
      /* hide scrollbar while keeping scroll behaviour */
      scrollbar-width: none;
    }
    html::-webkit-scrollbar { display: none; }

    body {
      font-family: var(--mono);
      background: transparent;
      color: var(--white);
      overflow-x: hidden;
    }

    /* ── Background canvas ── */
    #trace-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Scroll spacer — makes the page tall so native scroll works ── */
    #scroll-spacer {
      /* height overwritten by JS once we know step count */
      height: 900vh;
      pointer-events: none;
    }

    /* ── Terminal wrapper (fixed, full-viewport) ── */
    #terminal-wrapper {
      position: fixed;
      inset: 0;
      z-index: 1;
      padding: 2vh 2.5vw;
      display: flex;
      align-items: stretch;
      pointer-events: none;
    }

    /* ── Terminal window ── */
    .term-window {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--term-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 30px 90px rgba(0,0,0,0.85);
      pointer-events: auto;
    }

    /* ── Chrome bar ── */
    .term-chrome {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0.7rem 1rem;
      background: var(--chrome-bg);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      position: relative;
      user-select: none;
    }

    .term-dots {
      display: flex;
      gap: 0.42rem;
    }

    .term-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot-red    { background: #ff5f57; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green  { background: #28c840; }

    .term-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--mid);
      letter-spacing: 0.04em;
    }

    /* ── Terminal body ── */
    .term-body {
      flex: 1;
      overflow: hidden;
      padding: 1.4rem 1.8rem 1rem;
      font-family: var(--mono);
      font-size: clamp(0.72rem, 1.1vw, 0.85rem);
      line-height: 1.65;
      color: var(--white);
      display: flex;
      flex-direction: column;
    }

    /* Output scroll area — scrolls to latest as session grows */
    #term-output {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      scrollbar-width: none;
      transition: opacity 0.45s ease;
    }
    #term-output::-webkit-scrollbar { display: none; }

    #term-lines {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding-bottom: 0.25rem;
    }

    /* ── Line types ── */
    .line-prompt {
      display: flex;
      align-items: baseline;
      gap: 0.45rem;
      white-space: pre;
    }

    .prompt-host { color: var(--green); font-weight: 500; }
    .prompt-path { color: var(--mid); }
    .prompt-sym  { color: var(--dim); }
    .prompt-cmd  { color: var(--white); }

    .line-output {
      color: var(--mid);
      white-space: pre-wrap;
      word-break: break-word;
      padding-left: 0;
    }
    .line-output.bright { color: var(--white); }
    .line-output.green  { color: var(--green); }
    .line-output.dim    { color: var(--dim); }
    .line-output.mt     { margin-top: 0.6rem; }
    .line-output.mb     { margin-bottom: 0.6rem; }
    .line-output.empty  { height: 0.8rem; }

    /* ── Blinking block cursor ── */
    .cursor {
      display: inline-block;
      width: 0.52em;
      height: 1em;
      background: var(--green);
      vertical-align: text-bottom;
      margin-left: 1px;
      animation: blink 0.9s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Progress bar (thin line at bottom of chrome) ── */
    .term-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 1px;
      background: rgba(74, 222, 128, 0.35);
      width: 0%;
      transition: width 0.15s linear;
    }

    /* ════════════════════════════════════
       LEAPS SUB-WINDOW
    ════════════════════════════════════ */
    #leaps-window {
      position: absolute;
      top: 12vh;
      left: 50%;
      width: min(76%, 700px);
      height: 62vh;
      display: flex;
      flex-direction: column;
      background: #0c0c0c;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 10px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        0 32px 100px rgba(0,0,0,0.92);
      z-index: 10;
      opacity: 0;
      transform: translateX(-50%) scale(0.96) translateY(10px);
      transition: opacity 0.38s ease, transform 0.38s ease;
      pointer-events: none;
    }

    #leaps-window.visible {
      opacity: 1;
      transform: translateX(-50%) scale(1) translateY(0);
      pointer-events: auto;
    }

    .leaps-win-chrome {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 1rem;
      background: #1c1c1c;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      user-select: none;
    }

    .leaps-win-url {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.07);
      padding: 0.22rem 0.7rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      color: #888;
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-radius: 3px;
    }

    .leaps-win-open {
      font-family: var(--mono);
      font-size: 0.63rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mid);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 0.2rem 0.6rem;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .leaps-win-open:hover { color: #e8e8e8; border-color: rgba(255,255,255,0.2); }

    .leaps-win-body {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #fff;
    }

    #leaps-iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 900px;
      border: none;
      transform-origin: top left;
      pointer-events: none;
    }

    .leaps-win-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .leaps-win-overlay-label {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #e8e8e8;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.18);
      padding: 0.55rem 1.3rem;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .leaps-win-overlay:hover .leaps-win-overlay-label { opacity: 1; }
  </style>
</head>
<body>

  <!-- Background agent-trace animation -->
  <canvas id="trace-canvas"></canvas>

  <!-- Makes the page tall so the browser's native scroll mechanism works -->
  <div id="scroll-spacer"></div>

  <!-- Fixed terminal — always covers the viewport -->
  <div id="terminal-wrapper">

    <!-- Leaps sub-window (floats above the terminal body) -->
    <div id="leaps-window">
      <div class="leaps-win-chrome">
        <div class="term-dots">
          <div class="term-dot dot-red"></div>
          <div class="term-dot dot-yellow"></div>
          <div class="term-dot dot-green"></div>
        </div>
        <div class="leaps-win-url">https://leaps.to</div>
        <a href="https://leaps.to" target="_blank" rel="noopener" class="leaps-win-open">Open ↗</a>
      </div>
      <div class="leaps-win-body">
        <iframe
          src="https://leaps.to"
          id="leaps-iframe"
          title="Leaps — live product"
          loading="lazy"
          sandbox="allow-scripts allow-same-origin"
        ></iframe>
        <a href="https://leaps.to" target="_blank" rel="noopener" class="leaps-win-overlay">
          <span class="leaps-win-overlay-label">Open Leaps ↗</span>
        </a>
      </div>
    </div>

    <div class="term-window">

      <div class="term-chrome">
        <div class="term-dots">
          <div class="term-dot dot-red"></div>
          <div class="term-dot dot-yellow"></div>
          <div class="term-dot dot-green"></div>
        </div>
        <div class="term-title">bippin@portfolio — zsh</div>
        <div class="term-progress" id="term-progress"></div>
      </div>

      <div class="term-body">
        <div id="term-output">
          <div id="term-lines">
            <!-- Lines injected by JS -->
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    /* ════════════════════════════════════════════════════════
       AGENT-TRACE BACKGROUND ANIMATION
    ════════════════════════════════════════════════════════ */
    (function () {
      const canvas = document.getElementById('trace-canvas');
      const ctx    = canvas.getContext('2d');
      let W, H;

      const FS   = 11;
      const LH   = 19;
      const FONT = `${FS}px 'JetBrains Mono','SF Mono','Fira Code',monospace`;

      const ALPHA = { orch:0.07, call:0.09, res:0.08, ok:0.13, skip:0.03 };
      const COL   = { ok:[74,222,128], _:[220,215,210] };

      const STREAMS = [
        {
          x: 0.04, spd: 11, scroll: 0,
          L: [
            { t:'orch', s:'[orch]     session=s_3f8a · user=u_001'        },
            { t:'orch', s:'[orch]     → resume_parser.extract()'           },
            { t:'res',  s:'[parser]   skills=14  exp=2y  emb=dim_1536'    },
            { t:'orch', s:'[orch]     → job_fetcher.run(q="AI engineer")'  },
            { t:'res',  s:'[fetcher]  47 listings scraped'                 },
            { t:'orch', s:'[orch]     → fit_scorer.batch(n=47)'            },
            { t:'res',  s:'[scorer]   jd_4521  0.91  →  APPLY'            },
            { t:'skip', s:'[scorer]   jd_4522  0.43  →  skip'             },
            { t:'res',  s:'[scorer]   jd_4523  0.87  →  APPLY'            },
            { t:'skip', s:'[scorer]   jd_4524  0.31  →  skip'             },
            { t:'res',  s:'[scorer]   jd_4525  0.88  →  APPLY'            },
            { t:'skip', s:'[scorer]   jd_4526  0.51  →  skip'             },
            { t:'res',  s:'[scorer]   done · 12 / 47 matched'             },
            { t:'orch', s:'[orch]     → gap_analyst.run(jobs=12)'          },
            { t:'res',  s:'[gap]      jd_4521  gaps: none'                },
            { t:'res',  s:'[gap]      jd_4523  gaps: k8s (minor)'         },
            { t:'res',  s:'[gap]      jd_4525  gaps: none'                },
            { t:'orch', s:'[orch]     dispatching 12 agents'               },
            { t:'skip', s:'' }, { t:'skip', s:'' },
            { t:'skip', s:'' }, { t:'skip', s:'' },
          ]
        },
        {
          x: 0.385, spd: 8.5, scroll: 130,
          L: [
            { t:'orch', s:'[agent_01]  linkedin · jd_4521'               },
            { t:'call', s:'[agent_01]  → page.goto(job_url)'             },
            { t:'call', s:'[agent_01]  → dom.read_form()'                },
            { t:'res',  s:'[agent_01]  8 fields  ·  2 dynamic'           },
            { t:'call', s:'[agent_01]  → llm.fill(work_experience)'      },
            { t:'call', s:'[agent_01]  → llm.fill(skills_summary)'       },
            { t:'orch', s:'[agent_01]  generating cover context...'      },
            { t:'call', s:'[agent_01]  → llm.fill(cover_note)  847ms'    },
            { t:'call', s:'[agent_01]  → llm.fill(open_ended[0])'        },
            { t:'call', s:'[agent_01]  → llm.fill(open_ended[1])'        },
            { t:'call', s:'[agent_01]  → page.submit()'                  },
            { t:'ok',   s:'[agent_01]  ✓  submitted · 09:14:33 UTC'     },
            { t:'orch', s:'[agent_01]  idle · awaiting next'              },
            { t:'skip', s:'' }, { t:'skip', s:'' }, { t:'skip', s:'' },
            { t:'orch', s:'[agent_01]  ashby · jd_4525'                  },
            { t:'call', s:'[agent_01]  → page.goto(job_url)'             },
            { t:'res',  s:'[agent_01]  single-form · 9 fields'           },
            { t:'call', s:'[agent_01]  → doc.attach(resume.pdf)'         },
            { t:'call', s:'[agent_01]  → llm.fill(why_company)'          },
            { t:'call', s:'[agent_01]  → llm.fill(technical_challenge)'  },
            { t:'call', s:'[agent_01]  → page.submit()'                  },
            { t:'ok',   s:'[agent_01]  ✓  submitted · 09:15:02 UTC'     },
            { t:'skip', s:'' }, { t:'skip', s:'' }, { t:'skip', s:'' },
          ]
        },
        {
          x: 0.72, spd: 13, scroll: 270,
          L: [
            { t:'orch', s:'[agent_02]  ashby · jd_4523'                  },
            { t:'call', s:'[agent_02]  → page.goto(job_url)'             },
            { t:'res',  s:'[agent_02]  single-form · 11 fields'          },
            { t:'call', s:'[agent_02]  → doc.attach(resume.pdf)'         },
            { t:'call', s:'[agent_02]  → llm.fill(linkedin_url)'         },
            { t:'orch', s:'[agent_02]  reasoning: role fit...'           },
            { t:'call', s:'[agent_02]  → llm.fill(why_role)  1.1s'       },
            { t:'call', s:'[agent_02]  → llm.fill(tech_challenge)'       },
            { t:'orch', s:'[agent_02]  reasoning: achievement...'        },
            { t:'call', s:'[agent_02]  → llm.fill(achievement)  934ms'   },
            { t:'call', s:'[agent_02]  → page.submit()'                  },
            { t:'ok',   s:'[agent_02]  ✓  submitted · 09:14:51 UTC'     },
            { t:'orch', s:'[orch]      2 / 12 done  ·  10 remaining'     },
            { t:'skip', s:'' }, { t:'skip', s:'' }, { t:'skip', s:'' },
            { t:'orch', s:'[agent_02]  linkedin · jd_4528'               },
            { t:'call', s:'[agent_02]  → page.goto(job_url)'             },
            { t:'res',  s:'[agent_02]  multi-step · turn=1 of 4'         },
            { t:'call', s:'[agent_02]  → llm.fill(basic_info)'           },
            { t:'call', s:'[agent_02]  → page.next()'                    },
            { t:'res',  s:'[agent_02]  turn=2 · 5 fields'                },
            { t:'call', s:'[agent_02]  → llm.fill(experience)'           },
            { t:'call', s:'[agent_02]  → page.next()'                    },
            { t:'res',  s:'[agent_02]  turn=3 · screening=3'             },
            { t:'call', s:'[agent_02]  → llm.fill(screening_q[0])'       },
            { t:'call', s:'[agent_02]  → page.submit()'                  },
            { t:'ok',   s:'[agent_02]  ✓  submitted · 09:15:19 UTC'     },
            { t:'skip', s:'' }, { t:'skip', s:'' }, { t:'skip', s:'' },
          ]
        }
      ];

      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }

      let lt = 0;

      function render(ts) {
        const dt = Math.min((ts - lt) * 0.001, 0.05);
        lt = ts;
        ctx.clearRect(0, 0, W, H);
        ctx.font         = FONT;
        ctx.textBaseline = 'alphabetic';

        const ftop = H * 0.18;
        const fbot = H * 0.09;

        for (const s of STREAMS) {
          s.scroll += s.spd * dt;
          const x = s.x * W;
          const N = s.L.length;
          const nMin = Math.floor((s.scroll - H - LH) / LH);
          const nMax = Math.ceil((s.scroll + LH) / LH);

          for (let n = nMin; n <= nMax; n++) {
            const idx = ((n % N) + N) % N;
            const ln  = s.L[idx];
            if (!ln.s) continue;

            const py = n * LH - s.scroll + H;
            if (py < -LH || py > H + LH) continue;

            let base = ALPHA[ln.t] ?? 0.07;
            let fade = 1;
            if (py < ftop)     fade = Math.max(0, py / ftop);
            if (py > H - fbot) fade = Math.max(0, (H - py) / fbot);

            const a = base * fade;
            if (a < 0.003) continue;

            const [r, g, b] = ln.t === 'ok' ? COL.ok : COL._;
            ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
            ctx.fillText(ln.s, x, py);
          }
        }

        requestAnimationFrame(render);
      }

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(render);
    })();

    /* ════════════════════════════════════════════════════════
       TERMINAL SESSION
    ════════════════════════════════════════════════════════ */
    (function () {
      const SCROLL_HEIGHT_VH = 900;
      document.getElementById('scroll-spacer').style.height = SCROLL_HEIGHT_VH + 'vh';

      const linesEl    = document.getElementById('term-lines');
      const outputEl   = document.getElementById('term-output');
      const progressEl = document.getElementById('term-progress');

      /* ── DOM helpers ── */
      function scrollBottom() {
        outputEl.scrollTop = outputEl.scrollHeight;
      }

      function addLine(cls, html) {
        const d = document.createElement('div');
        d.className = cls;
        d.innerHTML = html;
        linesEl.appendChild(d);
        scrollBottom();
        return d;
      }

      /* Adds a prompt line; if withCursor=true, appends blinking cursor inside it */
      function addPrompt(cmd, withCursor) {
        const d = document.createElement('div');
        d.className = 'line-prompt';
        d.innerHTML =
          '<span class="prompt-host">bippin@portfolio</span>' +
          '<span class="prompt-sym">:~$&nbsp;</span>' +
          '<span class="prompt-cmd">' + (cmd ? esc(cmd) : '') + '</span>';
        if (withCursor) {
          const c = document.createElement('span');
          c.className = 'cursor';
          d.appendChild(c);
          state.cursorEl = c;
        }
        linesEl.appendChild(d);
        scrollBottom();
        return d;
      }

      function esc(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }

      /* ── Leaps sub-window helpers ── */
      const leapsWin    = document.getElementById('leaps-window');
      const leapsIframe = document.getElementById('leaps-iframe');

      function scaleLeapsIframe() {
        const bodyW = leapsWin.querySelector('.leaps-win-body').offsetWidth;
        if (bodyW > 0) {
          leapsIframe.style.transform = 'scale(' + (bodyW / 1280).toFixed(4) + ')';
        }
      }

      function showLeapsWindow() {
        scaleLeapsIframe();
        leapsWin.classList.add('visible');
      }

      function hideLeapsWindow() {
        leapsWin.classList.remove('visible');
      }

      window.addEventListener('resize', scaleLeapsIframe);

      /* ── Session steps ── */
      const STEPS = [
        { cmd: 'whoami',            startAt: 0.00 },
        { cmd: 'ls --sections',     startAt: 0.11 },
        { cmd: 'cat about.txt',     startAt: 0.22 },
        { cmd: 'cat leaps.md',      startAt: 0.35 },
        { cmd: 'open leaps.to',     startAt: 0.47, after:  showLeapsWindow },
        { cmd: 'cat experience.md', startAt: 0.57, before: hideLeapsWindow },
        { cmd: 'cat projects.md',   startAt: 0.70 },
        { cmd: 'cat stack.txt',     startAt: 0.80 },
        { cmd: 'contact --all',     startAt: 0.90 },
      ];

      /* ── Output data: [className, innerHTML] per step ── */
      const STEP_OUTPUT = [

        /* 0: whoami */
        [
          ['line-output bright mt', 'Desham Bippin Shekar Goud'],
          ['line-output dim',       'Founder &amp; AI Systems Architect'],
          ['line-output empty',     ''],
          ['line-output', 'Currently founding Leaps — autonomous multi-agent job execution.'],
          ['line-output', 'Before that: founding AI engineer at two early-stage companies,'],
          ['line-output', 'building enterprise T2SQL engines, VoC pipelines at 100K+ inputs/day,'],
          ['line-output', 'and agentic systems from scratch.'],
          ['line-output empty', ''],
        ],

        /* 1: ls --sections */
        [
          ['line-output mt', 'about.txt &nbsp;&nbsp;&nbsp; leaps.md &nbsp;&nbsp;&nbsp;&nbsp; experience.md'],
          ['line-output',    'projects.md &nbsp; stack.txt &nbsp;&nbsp;&nbsp; contact'],
          ['line-output empty', ''],
        ],

        /* 2: cat about.txt */
        [
          ['line-output bright mt', 'Name &nbsp;&nbsp; Desham Bippin Shekar Goud'],
          ['line-output',           'Role &nbsp;&nbsp; Founder &amp; AI Systems Architect'],
          ['line-output empty', ''],
          ['line-output dim',  '─────────────────────────────────'],
          ['line-output bright', 'Stats'],
          ['line-output', '  40% &nbsp;&nbsp;&nbsp;&nbsp; latency reduction'],
          ['line-output', '  33× &nbsp;&nbsp;&nbsp;&nbsp; throughput increase'],
          ['line-output', '  100K+ &nbsp;&nbsp; inputs / day processed'],
          ['line-output', '  98% &nbsp;&nbsp;&nbsp;&nbsp; T2SQL generation accuracy'],
          ['line-output', '  0→4.3% &nbsp; interview conversion rate (Leaps week-1)'],
          ['line-output empty', ''],
        ],

      /* ── State ── */
      const state = {
        activated: -1,
        typing:    false,
        cursorEl:  null,
        looping:   false,
      };

      /* ── Typewriter: types text char by char into el, then calls done() ── */
      function typeInto(el, text, done) {
        let i = 0;
        state.typing = true;
        function tick() {
          el.textContent = text.slice(0, ++i);
          scrollBottom();
          if (i < text.length) {
            setTimeout(tick, 38 + Math.random() * 30);
          } else {
            state.typing = false;
            if (done) done();
          }
        }
        setTimeout(tick, 100);
      }

      /* ── Render output lines one by one with small delay ── */
      function renderLines(lines, done) {
        let i = 0;
        function next() {
          if (i >= lines.length) { if (done) done(); return; }
          const [cls, html] = lines[i++];
          addLine(cls, html);
          setTimeout(next, 32);
        }
        next();
      }

      /* ── Activate step i ── */
      function activateStep(i) {
        if (i !== state.activated + 1) return;
        state.activated = i;

        if (state.cursorEl) {
          state.cursorEl.remove();
          state.cursorEl = null;
        }

        const step = STEPS[i];

        if (step.before) step.before();

        const prompt  = addPrompt('', false);
        const cmdSpan = prompt.querySelector('.prompt-cmd');

        typeInto(cmdSpan, step.cmd, function () {
          const output = STEP_OUTPUT[i] || [];
          renderLines(output, function () {
            if (step.after) {
              setTimeout(step.after, 220);
            }
            addPrompt('', true);
          });
        });
      }

      /* ── Infinite loop: fade out, reset, scroll to top, fade in ── */
      function triggerLoop() {
        state.looping = true;

        if (state.cursorEl) { state.cursorEl.remove(); state.cursorEl = null; }

        // Type a "clear" command then fade out
        const clearPrompt  = addPrompt('', false);
        const clearCmdSpan = clearPrompt.querySelector('.prompt-cmd');

        typeInto(clearCmdSpan, 'clear', function () {
          addLine('line-output dim mt', '# session complete — restarting …');

          setTimeout(function () {
            outputEl.style.opacity = '0';

            setTimeout(function () {
              // Wipe terminal
              linesEl.innerHTML = '';
              state.activated   = -1;
              state.typing      = false;
              state.cursorEl    = null;
              state.looping     = false;
              hideLeapsWindow();

              // Jump to top
              window.scrollTo(0, 0);

              // Re-boot
              addLine('line-output dim', 'Last login: Mon Jun  2 09:12:04 on ttys001');
              addLine('line-output empty', '');
              addPrompt('', true);

              // Fade back in after a double rAF so the opacity:0 is painted first
              requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                  outputEl.style.opacity = '1';
                  onScroll();
                });
              });
            }, 500);
          }, 900);
        });
      }

      /* ── Scroll engine ── */
      function onScroll() {
        if (state.looping) return;

        const maxY     = document.documentElement.scrollHeight - window.innerHeight;
        const progress = maxY > 0 ? window.scrollY / maxY : 0;

        progressEl.style.width = (progress * 100).toFixed(2) + '%';

        // All steps done + near end → loop
        if (
          state.activated === STEPS.length - 1 &&
          !state.typing   &&
          progress >= 0.96
        ) {
          triggerLoop();
          return;
        }

        const next = state.activated + 1;
        if (next < STEPS.length && progress >= STEPS[next].startAt && !state.typing) {
          activateStep(next);
        }
      }

      window.addEventListener('scroll', onScroll, { passive: true });

      /* ── Boot ── */
      function boot() {
        addLine('line-output dim', 'Last login: Mon Jun  2 09:12:04 on ttys001');
        addLine('line-output empty', '');
        addPrompt('', true);
        onScroll();
      }

      boot();
    })();
